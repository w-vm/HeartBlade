name: Avatar

# Manual: downloads the banner gif, crops it to a centred square and saves plugins/accounts/avatar.gif
# (used as the avatar of the /token reply, which needs a square image).
on: workflow_dispatch

permissions:
  contents: write

jobs:
  crop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
      - name: Crop to a square
        run: |
          curl -fsSL -A "Mozilla/5.0" -o in.gif https://heartunderblade.neocities.org/old_site/images/shinobu1.gif
          identify -format "%wx%h\n" in.gif | head -1
          S=$(identify -format "%[fx:min(w,h)]\n" in.gif | head -1)
          convert in.gif -coalesce -gravity center -crop ${S}x${S}+0+0 +repage -resize 256x256 -layers optimize plugins/accounts/avatar.gif
          ls -l plugins/accounts/avatar.gif
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add plugins/accounts/avatar.gif
          git commit -m "Square avatar for the /token reply" || echo "nothing to commit"
          git push
